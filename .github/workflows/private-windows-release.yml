name: Owner private-source Windows release
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact reviewed private source commit
        required: true
      source_tree:
        description: Exact private Git tree verified after checkout
        required: true
      version:
        description: New immutable Test version
        required: true
        default: '1.4.0'
      previous_version:
        description: Actual previous public Test version
        required: true
        default: '1.3.0'
      publication_approval:
        description: Type publish-test-candidate to authorize Test publication
        required: true
      probe_only:
        description: Verify the free public Windows runner without source or secrets
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: owner-public-windows-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && (inputs.probe_only || inputs.publication_approval == 'publish-test-candidate')
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      SOURCE_TREE: ${{ inputs.source_tree }}
      VERSION: ${{ inputs.version }}
      PREVIOUS_VERSION: ${{ inputs.previous_version }}
      PYTHONIOENCODING: utf-8
    steps:
      - name: Verify standard public Windows runner
        if: inputs.probe_only
        shell: pwsh
        run: |
          if (-not $IsWindows) { throw 'Windows required' }
          Write-Output 'Public Windows runner started successfully. No private source or signing secrets accessed.'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: ${{ !inputs.probe_only }}
        with:
          persist-credentials: false
          path: controller
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: ${{ !inputs.probe_only }}
        with:
          repository: Kaikulon-ThePirate/poe-economy-dashboard
          ref: ${{ inputs.source_commit }}
          ssh-key: ${{ secrets.SOURCE_READ_ONLY_SSH_KEY }}
          persist-credentials: false
          path: private-source
      - name: Verify exact private source commit and Git tree
        if: ${{ !inputs.probe_only }}
        shell: pwsh
        run: |
          if ($env:SOURCE_COMMIT -notmatch '^[a-f0-9]{40}$' -or $env:SOURCE_TREE -notmatch '^[a-f0-9]{40}$') { throw 'Invalid source identity' }
          $source=Join-Path $env:GITHUB_WORKSPACE 'private-source'
          $sha=(& git -C $source rev-parse HEAD).Trim()
          $tree=(& git -C $source rev-parse 'HEAD^{tree}').Trim()
          if ($sha -ne $env:SOURCE_COMMIT -or $tree -ne $env:SOURCE_TREE) { throw 'Private source identity mismatch' }
          "PRIVATE_SOURCE_DIR=$source" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: ${{ !inputs.probe_only }}
        with:
          python-version: '3.14.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: ${{ !inputs.probe_only }}
        with:
          node-version: '24.22.1'
      - name: Full private quality and native Windows gates
        if: ${{ !inputs.probe_only }}
        shell: pwsh
        run: |
          & pwsh -NoLogo -NoProfile -File "$env:PRIVATE_SOURCE_DIR/scripts/public-owner-build.ps1" -Phase quality -SourceCommit $env:SOURCE_COMMIT -Version $env:VERSION -PreviousVersion $env:PREVIOUS_VERSION *> "$env:RUNNER_TEMP/quality.log"
          if ($LASTEXITCODE) { throw 'Private quality gate failed. Details are encrypted in the owner build report.' }
      - name: Build production-signed metadata and prove public N-1 update
        if: ${{ !inputs.probe_only }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_TRUST_JSON: ${{ vars.PRODUCTION_TRUST_JSON }}
          MANIFEST_KEY_ID: ${{ vars.MANIFEST_KEY_ID }}
          ENCRYPTED_MANIFEST_KEY: ${{ secrets.ENCRYPTED_MANIFEST_KEY }}
          POE_KEY_PASSWORD: ${{ secrets.MANIFEST_KEY_PASSWORD }}
        run: |
          & pwsh -NoLogo -NoProfile -File "$env:PRIVATE_SOURCE_DIR/scripts/public-owner-build.ps1" -Phase publish -SourceCommit $env:SOURCE_COMMIT -Version $env:VERSION -PreviousVersion $env:PREVIOUS_VERSION *> "$env:RUNNER_TEMP/publish.log"
          if ($LASTEXITCODE) { throw 'Private publication gate failed. Previous Test pointer is retained/restored on native failure.' }
      - name: Save encrypted logs and source-bound non-source results
        if: ${{ always() && !inputs.probe_only }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_BUILD_LOG_KEY: ${{ secrets.PRIVATE_BUILD_LOG_KEY }}
          BUILD_STATUS: ${{ job.status }}
        run: ./controller/.github/scripts/secure-source.ps1
